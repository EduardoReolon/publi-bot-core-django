[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publi-bot-core-django"
dynamic = ["version"]
description = "O lado do site no contrato PubliBot /api/v1: app Django que recebe artigos, respostas e fotos de autor, e mede leitura e conversao."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Django>=4.2",
  "nh3>=0.2.14",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.8", "ruff>=0.5"]

[tool.setuptools.dynamic]
version = { attr = "publibot_core.__version__" }

[tool.setuptools.packages.find]
include = ["publibot_core*"]

[tool.setuptools.package-data]
publibot_core = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]
